name: Build signed release APK

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for this public-safe pilot build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vcb-pilot-apk
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate reviewed commit SHA
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/codex/* && "$GITHUB_REF" != refs/heads/main ]]; then
            printf '%s\n' 'PILOT_BLOCKED_REF: use an active branch or main.' >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ || "$REVIEWED_SHA" != "$GITHUB_SHA" ]]; then
            printf '%s\n' 'PILOT_BLOCKED_REVIEW: dispatch must resolve to the reviewed full SHA.' >&2
            exit 1
          fi

  build:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing secrets live only in this environment; protect it with a required reviewer.
    environment: release-signing
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s\n' 'RELEASE_SIGNING_MISSING: set ANDROID_KEYSTORE_BASE64 in the release-signing environment.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # run_number only grows for this workflow file; renaming the file resets it, so raise the offset if that ever happens.
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease testDebugUnitTest verifyWebhookConfigurationPolicy validateReleaseWebhookConfig -PversionCode="$version_code"
          test -s app/build/outputs/apk/release/app-release.apk
          printf 'VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          certs=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            printf '%s\n' 'SECURITY VIOLATION: release APK is signed with a debug key.' >&2
            exit 1
          fi
          # The certificate digest is public; it must stay identical across builds or updates will be refused.
          grep 'certificate SHA-256 digest' <<<"$certs" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'versionCode: %s\n' "$VERSION_CODE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Security scan APK artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          bc_path = 'app/build/generated/source/buildConfig/release/vn/phuong/financebridge/BuildConfig.java'
          assert os.path.isfile(bc_path), 'BuildConfig not found'
          with open(bc_path) as f:
              bc_content = f.read()
          assert 'WEBHOOK_SECRET' not in bc_content, 'SECURITY VIOLATION: BuildConfig contains WEBHOOK_SECRET'
          assert 'WEBHOOK_URL' in bc_content, 'BuildConfig must contain WEBHOOK_URL'

          apk_path = 'app/build/outputs/apk/release/app-release.apk'
          assert os.path.isfile(apk_path), 'APK not found'
          with zipfile.ZipFile(apk_path, 'r') as z:
              dex_files = [n for n in z.namelist() if n.endswith('.dex')]
              assert dex_files, 'No dex files found'
              for dex in dex_files:
                  data = z.read(dex)
                  assert b'WEBHOOK_SECRET' not in data, f'SECURITY VIOLATION: WEBHOOK_SECRET found in {dex}'
          print('Security scan PASSED: APK contains no embedded secrets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finance-bridge-release-apk-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
