name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: vercel/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm test
      - run: npm run typecheck

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest verifyWebhookConfigurationPolicy validateReleaseWebhookConfig
      - name: Reject release builds with insecure or malformed endpoint
        run: |
          if WEBHOOK_URL="http://insecure.example.com/api/transaction" ./gradlew --no-daemon validateReleaseWebhookConfig > "$RUNNER_TEMP/insecure-endpoint-check.log" 2>&1; then
            echo 'Insecure endpoint release validation unexpectedly succeeded'
            exit 1
          fi
          grep -q 'Release builds require a valid HTTPS /api/transaction endpoint' "$RUNNER_TEMP/insecure-endpoint-check.log"
      - name: Security scan APK artifact and BuildConfig
        run: |
          python3 - <<'PY'
          import os, zipfile
          bc_path = 'app/build/generated/source/buildConfig/debug/vn/phuong/financebridge/BuildConfig.java'
          assert os.path.isfile(bc_path), 'BuildConfig not found'
          with open(bc_path) as f:
              bc_content = f.read()
          assert 'WEBHOOK_SECRET' not in bc_content, 'BuildConfig must not contain WEBHOOK_SECRET'
          assert 'WEBHOOK_URL' in bc_content, 'BuildConfig must contain WEBHOOK_URL'

          apk_path = 'app/build/outputs/apk/debug/app-debug.apk'
          assert os.path.isfile(apk_path), 'APK artifact not found'
          with zipfile.ZipFile(apk_path, 'r') as z:
              dex_files = [n for n in z.namelist() if n.endswith('.dex')]
              assert dex_files, 'No dex files found in APK'
              for dex in dex_files:
                  data = z.read(dex)
                  assert b'WEBHOOK_SECRET' not in data, f'WEBHOOK_SECRET found in {dex}'
          print('Security scan PASSED: APK and BuildConfig are completely free of embedded WEBHOOK_SECRET')
          PY
      - name: Unit test counts
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = [ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          assert reports, 'No Android test reports'
          print({key: sum(int(report.get(key, '0')) for report in reports) for key in ['tests', 'failures', 'errors', 'skipped']})
          PY
