name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: vercel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest verifyWebhookConfigurationPolicy
      - name: Reject release without private configuration
        run: |
          if ./gradlew --no-daemon validateReleaseWebhookConfig > "$RUNNER_TEMP/release-config-check.log" 2>&1; then
            echo 'Unconfigured release validation unexpectedly succeeded'
            exit 1
          fi
          grep -q 'Release builds require' "$RUNNER_TEMP/release-config-check.log"
      - name: Unit test counts
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = [ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          assert reports, 'No Android test reports'
          print({key: sum(int(report.get(key, '0')) for report in reports) for key in ['tests', 'failures', 'errors', 'skipped']})
          PY
